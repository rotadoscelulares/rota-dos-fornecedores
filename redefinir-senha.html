<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0D10" />
  <meta name="color-scheme" content="dark" />
  <title>Redefinir senha — Rota dos Celulares 66</title>
  <link rel="icon" type="image/png" href="assets/img/logo-oficial.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html#inicio" aria-label="Rota dos Celulares 66 — página inicial">
        <img src="assets/img/logo-oficial.png" alt="Logotipo Rota dos Celulares 66" class="brand-logo" width="44" height="44" decoding="async" />
        <span class="brand-name">Rota dos Celulares <strong>66</strong></span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo-principal">
    <section class="auth-section">
      <div class="container auth-container">
        <div class="card auth-card">
          <p class="eyebrow">Área do cliente</p>
          <h1 class="auth-title">Criar nova senha</h1>
          <p class="hero-subtitle">Escolha uma nova senha para sua conta.</p>

          <form id="formRedefinir" class="auth-form" novalidate>
            <div class="form-field">
              <label for="novaSenha">Nova senha</label>
              <input type="password" id="novaSenha" name="novaSenha" autocomplete="new-password" required />
            </div>
            <ul id="senhaRegras" class="senha-regras" aria-live="polite"></ul>
            <div class="form-field">
              <label for="confirmarSenha">Confirmar nova senha</label>
              <input type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password" required />
            </div>

            <p id="formErro" class="form-error" role="alert" hidden></p>
            <p id="formSucesso" class="form-success" role="status" hidden></p>

            <button type="submit" class="btn btn-primary auth-submit">Salvar nova senha</button>
          </form>

          <p class="auth-switch"><a href="login.html">Voltar para o login</a></p>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/auth-client.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("token");
      var senhaInput = document.getElementById("novaSenha");
      var regrasList = document.getElementById("senhaRegras");
      var erroEl = document.getElementById("formErro");
      var sucessoEl = document.getElementById("formSucesso");
      var form = document.getElementById("formRedefinir");

      if (!token) {
        erroEl.textContent = "Link inválido. Solicite um novo em \u201cEsqueci minha senha\u201d.";
        erroEl.hidden = false;
        form.querySelectorAll("input, button").forEach(function (el) { el.disabled = true; });
      }

      function renderRegras() {
        var valor = senhaInput.value;
        regrasList.innerHTML = window.SENHA_REGRAS.map(function (regra) {
          var ok = regra.test(valor);
          return '<li class="' + (ok ? "regra-ok" : "regra-pendente") + '">' + (ok ? "✓" : "○") + " " + regra.label + "</li>";
        }).join("");
      }
      senhaInput.addEventListener("input", renderRegras);
      renderRegras();

      form.addEventListener("submit", async function (evt) {
        evt.preventDefault();
        erroEl.hidden = true;
        sucessoEl.hidden = true;

        var novaSenha = senhaInput.value;
        var confirmar = document.getElementById("confirmarSenha").value;
        if (novaSenha !== confirmar) {
          erroEl.textContent = "As senhas não coincidem.";
          erroEl.hidden = false;
          return;
        }

        var submitBtn = form.querySelector("button[type=submit]");
        submitBtn.classList.add("is-loading");
        var resposta = await window.AUTH.redefinirSenha(token, novaSenha);
        submitBtn.classList.remove("is-loading");

        if (!resposta.ok) {
          erroEl.textContent = resposta.erro || "Não foi possível redefinir a senha.";
          erroEl.hidden = false;
          return;
        }

        sucessoEl.textContent = "Senha redefinida com sucesso! Redirecionando para o login…";
        sucessoEl.hidden = false;
        window.setTimeout(function () { window.location.href = "login.html"; }, 1500);
      });
    })();
  </script>
</body>
</html>
