<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0D10" />
  <meta name="color-scheme" content="dark" />
  <title>Entrar — Rota dos Celulares 66</title>
  <link rel="icon" type="image/png" href="assets/img/logo-oficial.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html#inicio" aria-label="Rota dos Celulares 66 — página inicial">
        <img src="assets/img/logo-oficial.png" alt="Logotipo Rota dos Celulares 66" class="brand-logo" width="44" height="44" decoding="async" />
        <span class="brand-name">Rota dos Celulares <strong>66</strong></span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="index.html#inicio">Início</a></li>
          <li><a href="cadastro.html">Criar conta</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo-principal">
    <section class="auth-section">
      <div class="container auth-container">
        <div class="card auth-card">
          <p class="eyebrow">Área do cliente</p>
          <h1 class="auth-title">Entrar</h1>
          <p class="hero-subtitle">Acesse sua conta para usar a plataforma.</p>

          <form id="formLogin" class="auth-form" novalidate>
            <div class="form-field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="email" required />
            </div>
            <div class="form-field">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" autocomplete="current-password" required />
            </div>

            <p id="formErro" class="form-error" role="alert" hidden></p>

            <button type="submit" class="btn btn-primary auth-submit">Entrar</button>
          </form>

          <p class="auth-switch">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
          <p class="auth-switch"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/auth-client.js"></script>
  <script>
    (function () {
      window.AUTH.me().then(function (resp) {
        if (resp.ok) window.location.href = resp.usuario.isAdmin ? "/admin/" : "index.html";
      });

      var erroEl = document.getElementById("formErro");
      document.getElementById("formLogin").addEventListener("submit", async function (evt) {
        evt.preventDefault();
        erroEl.hidden = true;

        var dados = {
          email: document.getElementById("email").value.trim(),
          senha: document.getElementById("senha").value,
        };

        var submitBtn = evt.target.querySelector("button[type=submit]");
        submitBtn.classList.add("is-loading");
        var resposta = await window.AUTH.login(dados);
        submitBtn.classList.remove("is-loading");

        if (!resposta.ok) {
          erroEl.textContent = resposta.erro || "Não foi possível entrar.";
          erroEl.hidden = false;
          return;
        }

        window.location.href = resposta.usuario.isAdmin ? "/admin/" : "index.html";
      });
    })();
  </script>
</body>
</html>
