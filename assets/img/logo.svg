<svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logotipo Rota dos Celulares 66">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C6238"/>
      <stop offset="100%" stop-color="#6E3C1E"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2013"/>
      <stop offset="100%" stop-color="#15100A"/>
    </linearGradient>
  </defs>

  <!-- moldura bronze estilo placa de rota -->
  <path
    d="M100,8 C130,8 120,30 150,25 C175,20 185,45 178,65 C172,85 165,90 165,110 C165,140 140,165 100,190 C60,165 35,140 35,110 C35,90 28,85 22,65 C15,45 25,20 50,25 C80,30 70,8 100,8 Z"
    fill="url(#frameGrad)"
  />

  <!-- fundo escuro interno -->
  <path
    d="M100,8 C130,8 120,30 150,25 C175,20 185,45 178,65 C172,85 165,90 165,110 C165,140 140,165 100,190 C60,165 35,140 35,110 C35,90 28,85 22,65 C15,45 25,20 50,25 C80,30 70,8 100,8 Z"
    fill="url(#plateGrad)"
    stroke="#C8A15A"
    stroke-width="1.5"
    stroke-opacity="0.7"
    transform="translate(10,9) scale(0.9)"
  />

  <!-- texto embutido -->
  <g font-family="Poppins, system-ui, sans-serif" text-anchor="middle" fill="#E2C47A">
    <text x="100" y="66" font-size="32" font-weight="700" letter-spacing="2">ROTA</text>
    <line x1="55" y1="80" x2="145" y2="80" stroke="#C8A15A" stroke-width="2" opacity="0.85"/>
    <text x="100" y="103" font-size="18" font-weight="500" font-style="italic">dos</text>
    <text x="100" y="130" font-size="24" font-weight="700">Celulares</text>
    <text x="100" y="174" font-size="44" font-weight="700">66</text>
  </g>
</svg>
